# Hermes profile distribution manifest.
# Schema: hermes_cli/profile_distribution.py (only `name` is required).
name: geometric-deep-learning-architect
version: 1.0.0
description: "Guides symmetry discovery, group identification, and equivariant neural-network design and audit."
hermes_requires: ">=0.21.0"
author: "Kushal D'Souza (lyndonkl)"
license: "MIT"

# No model or provider is pinned: installers keep whatever credentials they
# already have. The agent needs a web-capable model provider and nothing else.
env_requires:
  - name: OPENROUTER_API_KEY
    description: "API key for the provider every model in config.yaml is routed through"
    required: true
