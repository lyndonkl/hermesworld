# Hermes profile distribution manifest.
# Schema: hermes_cli/profile_distribution.py (only `name` is required).
name: welch-ai-guide
version: 1.0.0
description: "Interactive guide for the Welch Labs Illustrated Guide to AI repo."
hermes_requires: ">=0.21.0"
author: "Kushal D'Souza"
license: "MIT"

# No model or provider is pinned: installers keep whatever credentials they
# already have.
env_requires:
  - name: OPENROUTER_API_KEY
    description: "API key for the provider every model in config.yaml is routed through"
    required: true
