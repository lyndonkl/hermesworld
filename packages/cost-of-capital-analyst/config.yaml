# Behavioural defaults for the cost-of-capital-analyst Bot (generated by tools/build_team.py).
# Tier: fast (the Claude Code version ran this agent on sonnet). No model is pinned;
# apply one per tier with `python3 tools/team_models.py valuation --strong <model> --fast <model>`
# or set it directly with `hermes -p cost-of-capital-analyst model`. Preserved across `hermes profile update`.

agent:
  reasoning_effort: "medium"

skills:
  creation_nudge_interval: 0     # curated agent; do not nudge it to write new skills
