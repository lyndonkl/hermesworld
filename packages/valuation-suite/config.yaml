# Behavioural defaults for the valuation-suite profile.
# Deliberately no `model:` block — the installer's own credentials decide the
# model. tools/install.sh seeds one from your root profile; or run
# `hermes -p valuation-suite model` after install. Everything else here is optional and
# preserved across `hermes profile update` (the installer never overwrites
# config.yaml unless you pass --force-config).

agent:
  reasoning_effort: "high"

skills:
  creation_nudge_interval: 0     # this is a curated agent; do not nudge it to write new skills

delegation:
  max_iterations: 250            # each specialist stage is a delegate_task child
  max_concurrent_children: 4     # the dispatch graph runs at most 3 stages in parallel
  max_spawn_depth: 1             # specialists are leaves; only the orchestrator delegates

