# Model and behavioural defaults for the valuation-suite profile.
# Picks follow docs/MODELS.md (Artificial Analysis + OpenRouter, 2026-09-09).
# Orchestrator and children on the same strong agentic model (the single-profile form
# cannot split them further).
# Change the model any time with `hermes -p valuation-suite model`; this file is preserved across
# `hermes profile update`.

model:
  provider: openrouter
  default: meta/muse-spark-1.3

agent:
  reasoning_effort: "high"

skills:
  creation_nudge_interval: 0     # curated agent; do not nudge it to write new skills

# Every specialist stage is a delegate_task child; all children share this model.
delegation:
  provider: openrouter
  model: meta/muse-spark-1.3
  max_iterations: 250
  max_concurrent_children: 4     # the dispatch graph runs at most 3 stages in parallel
  max_spawn_depth: 1             # specialists are leaves; only the orchestrator delegates

# Housekeeping calls on a cheap model; nothing here needs reasoning.
auxiliary:
  compression:
    provider: openrouter
    model: z-ai/glm-5.3-flash
  title_generation:
    provider: openrouter
    model: z-ai/glm-5.3-flash
  background_review:
    provider: openrouter
    model: z-ai/glm-5.3-flash
