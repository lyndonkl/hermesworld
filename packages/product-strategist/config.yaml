# Model and behavioural defaults for the product-strategist profile.
# Picks follow docs/MODELS.md (Artificial Analysis + OpenRouter, 2026-09-09).
# Two models: a reasoning model for research and curation, a writing model for the report.
# Change the model any time with `hermes -p product-strategist model`; this file is preserved across
# `hermes profile update`.

model:
  provider: openrouter
  default: meta/muse-spark-1.3

agent:
  reasoning_effort: "high"

skills:
  creation_nudge_interval: 0     # curated agent; do not nudge it to write new skills

# Research and reasoning run on the model above. The report itself is written by a
# delegate_task child on the writing model below (SOUL.md, Step 8).
delegation:
  provider: openrouter
  model: google/gemini-3.7-flash
  max_iterations: 120
  max_concurrent_children: 4

# Housekeeping calls on a cheap model; nothing here needs reasoning.
auxiliary:
  compression:
    provider: openrouter
    model: z-ai/glm-5.3-flash
  title_generation:
    provider: openrouter
    model: z-ai/glm-5.3-flash
  background_review:
    provider: openrouter
    model: z-ai/glm-5.3-flash
