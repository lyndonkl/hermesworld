# Behavioural defaults for the company-diagnostician Bot (generated by tools/build_team.py).
# Tier: strong (the Claude Code version ran this agent on opus). No model is pinned;
# apply one per tier with `python3 tools/team_models.py valuation --strong <model> --fast <model>`
# or set it directly with `hermes -p company-diagnostician model`. Preserved across `hermes profile update`.

agent:
  reasoning_effort: "high"

skills:
  creation_nudge_interval: 0     # curated agent; do not nudge it to write new skills
