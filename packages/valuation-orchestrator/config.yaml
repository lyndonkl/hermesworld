# Behavioural defaults for the valuation-orchestrator Bot (generated by tools/build_team.py).
# Tier: orchestrator (the Claude Code version ran this agent on opus). No model is pinned;
# apply one per tier with `python3 tools/team_models.py valuation --preset balanced` (see
# docs/MODELS.md) or set it directly with `hermes -p valuation-orchestrator model`. Preserved across
# `hermes profile update`.

agent:
  reasoning_effort: "high"

skills:
  creation_nudge_interval: 0     # curated agent; do not nudge it to write new skills
