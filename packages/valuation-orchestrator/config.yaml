# Behavioural defaults for the valuation-orchestrator Bot (generated by tools/build_team.py).
# Tier: orchestrator (the Claude Code version ran this agent on opus). The model below is the
# team manifest's pick for this tier (see docs/MODELS.md). Change it with
# `python3 tools/team_models.py valuation --preset ...` or `hermes -p valuation-orchestrator model`.
# This file is preserved across `hermes profile update`.

model:
  provider: openrouter
  default: meta/muse-spark-1.3

agent:
  reasoning_effort: "high"

skills:
  creation_nudge_interval: 0     # curated agent; do not nudge it to write new skills

# Housekeeping calls on a cheap model; nothing here needs reasoning.
auxiliary:
  compression:
    provider: openrouter
    model: z-ai/glm-5.3-flash
  title_generation:
    provider: openrouter
    model: z-ai/glm-5.3-flash
  background_review:
    provider: openrouter
    model: z-ai/glm-5.3-flash
